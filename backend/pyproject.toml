[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # torch 本身是 camel-oasis 的间接依赖；显式声明是为了让下方 [tool.uv.sources]
    # 能在 Linux 上把它替换为 CPU 版本（uv 的 sources 只对直接依赖生效）
    "torch>=2.0.0,<2.10",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

# Linux 平台默认从 PyPI 安装的 torch 是 CUDA 版本（约 900MB，另加 3GB+ 的 nvidia-* 库）。
# MiroFish 只在 OASIS 可选推荐系统中用到 torch（且默认已关闭），这里改用 CPU 版本：
# 安装体积从 ~5GB 降到 ~1GB，`import torch` 更快、常驻内存更低，Docker 镜像也更小。
# 需要 GPU 推荐系统的用户可删除下面两段配置后重新执行 `uv lock`。
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
